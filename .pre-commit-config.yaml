# Configuración pre-commit estilo OCA (Odoo 19.0).
# Uso habitual: pre-commit run --files <archivos modificados>
exclude: |
  (?x)
  # No tocar dependencias ni artefactos
  /static/(?:lib|src/lib)/.*|
  .*\.(?:po|pot)$|
  /__pycache__/.*

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
